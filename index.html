<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>បញ្ចូលចំនួនម៉ោងប្រចាំថ្ងៃ</title>
    <style>
        body { font-family: 'Khmer OS Battambang', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 500px; }
        .header { background-color: #3b5998; color: white; text-align: center; padding: 12px; border-radius: 5px; font-weight: bold; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: 'Khmer OS Battambang'; }
        .row { display: flex; gap: 10px; }
        .row input { width: 50%; }
        .btn-submit { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-family: 'Khmer OS Battambang'; font-weight: bold; }
        .btn-submit:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">បញ្ចូលចំនួនម៉ោងប្រចាំថ្ងៃ</div>
    
    <form id="timeForm">
        <div class="form-group">
            <label>បញ្ចូលថ្ងៃខែឆ្នាំ</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label>១. ម៉ោងធម្មតា</label>
            <div class="row">
                <input type="text" id="normalTimeRange" placeholder="ចន្លោះម៉ោង (7:00-16:30)">
                <input type="text" id="normalHours" placeholder="ចំនួនម៉ោង (8)">
            </div>
        </div>

        <div class="form-group">
            <label>២. ថែមម៉ោងធម្មតា</label>
            <div class="row">
                <input type="text" id="otNormalTimeRange" placeholder="ចន្លោះម៉ោង (17:00-19:00)">
                <input type="text" id="otNormalHours" placeholder="ចំនួនម៉ោង (2)">
            </div>
        </div>

        <div class="form-group">
            <label>៣. ថែមម៉ោងអាទិត្យ</label>
            <div class="row">
                <input type="text" id="otSunTimeRange" placeholder="ចន្លោះម៉ោង (8:00-17:00)">
                <input type="text" id="otSunHours" placeholder="ចំនួនម៉ោង (8)">
            </div>
        </div>

        <div class="form-group">
            <label>៤. ថែមម៉ោងបុណ្យ</label>
            <div class="row">
                <input type="text" id="otHolidayTimeRange" placeholder="ចន្លោះម៉ោង (8:00-17:00)">
                <input type="text" id="otHolidayHours" placeholder="ចំនួនម៉ោង (8)">
            </div>
        </div>

        <button type="submit" class="btn-submit">បញ្ជូន</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyNtNOGSBMRpzn5Uuf21nW6hTlwLlYkQdU8FCxD8k3HnOOH9gnf4Ukbmona8JYz-ZoIzQ/exec'; // ជំនួសតំណរភ្ជាប់ថ្មីនៅទីនេះ

    const form = document.getElementById('timeForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // បង្ហាញដំណឹងកំពុងដំណើរការ (ស្រេចចិត្ត)
        const submitBtn = form.querySelector('.btn-submit');
        submitBtn.disabled = true;
        submitBtn.innerText = 'បញ្ជូន...';

        const data = {
            date: document.getElementById('date').value,
            normalTimeRange: document.getElementById('normalTimeRange').value,
            normalHours: document.getElementById('normalHours').value,
            otNormalTimeRange: document.getElementById('otNormalTimeRange').value,
            otNormalHours: document.getElementById('otNormalHours').value,
            otSunTimeRange: document.getElementById('otSunTimeRange').value,
            otSunHours: document.getElementById('otSunHours').value,
            otHolidayTimeRange: document.getElementById('otHolidayTimeRange').value,
            otHolidayHours: document.getElementById('otHolidayHours').value
        };

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', // ជួយជៀសវាងបញ្ហា CORS block ពេលផ្ញើទៅ Apps Script
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data) 
        })
        .then(() => {
            alert('ទិន្នន័យត្រូវបានបញ្ជូនដោយជោគជ័យ!');
            form.reset();
            submitBtn.disabled = false;
            submitBtn.innerText = 'បញ្ជូន';
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('មានបញ្ហាបញ្ជូនទិន្នន័យ!');
            submitBtn.disabled = false;
            submitBtn.innerText = 'បញ្ជូន';
        });
    });
</script>

</body>
</html>
